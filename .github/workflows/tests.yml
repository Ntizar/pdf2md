name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar el paquete (valida el empaquetado en cada push)
        run: pip install -e .
      - name: Instalar pytest
        run: pip install pytest
      - name: Pasar los tests
        run: pytest -v
